  - '{''effector.position'': ''bounds_99_woclip''}'
  num_workers: 0
  pin_memory: true
  prefetch_factor: 4
  prompt_type: global
  robot_config_root: /RoboTwin/experiments/lingbot_vla_v2_6b_robotwin/source/lingbot-vla-v2/configs/robot_configs
  source_name: null
  state_norm_type: none
  text_keys: messages
  train_path: /RoboTwin/data/robotwin_demo_clean_joint_v30.txt
  train_size: 10000000
  use_future_image: false
model:
  adanorm_time: true
  attn_implementation: eager
  basic_modules: []
  config_key: LingbotVLAV2Config
  config_path: /RoboTwin/experiments/lingbot_vla_v2_6b_robotwin/models/robbyant_lingbot-vla-v2-6b-robotwin/checkpoints/global_step_50000/hf_ckpt
