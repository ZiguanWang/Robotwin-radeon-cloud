data:
  cameras:
  - camera_top
  - camera_wrist_left
  - camera_wrist_right
  chat_template: default
  data_name: multi
  data_root: null
  data_tag: default
  data_type: conversation
  dataloader_type: native
  datasets_type: vla
  drop_last: true
  image_augment: false
  image_keys: images
  img_size: 256
  joints:
  - '{''arm.position'': 14}'
  - '{''end.position'': 14}'
  - '{''effector.position'': 2}'
  max_seq_len: 2048
  norm_stats_file: /RoboTwin/experiments/lingbot_vla_v2_6b_robotwin/source/lingbot-vla-v2/assets/norm_stats/robotwin.json
  norm_type:
  - '{''arm.position'': ''bounds_99_woclip''}'
